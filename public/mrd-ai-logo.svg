<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="aiGradient" x1="18" y1="14" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset=".48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="letterGradient" x1="38" y1="38" x2="92" y2="91">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset=".52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5"
        flood-color="#172554" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- AI hexagon -->
  <path
    d="M64 10
       L105 34
       L105 82
       L64 108
       L23 82
       L23 34 Z"
    fill="#ffffff"
    stroke="url(#aiGradient)"
    stroke-width="6"
    stroke-linejoin="round"
    filter="url(#softShadow)"
  />

  <!-- circuit nodes -->
  <g fill="#ffffff" stroke="url(#aiGradient)" stroke-width="4">
    <circle cx="64" cy="10" r="5"/>
    <circle cx="105" cy="34" r="5"/>
    <circle cx="105" cy="82" r="5"/>
    <circle cx="64" cy="108" r="5"/>
    <circle cx="23" cy="82" r="5"/>
    <circle cx="23" cy="34" r="5"/>
  </g>

  <!-- circuit details -->
  <g stroke="url(#aiGradient)" stroke-width="4" stroke-linecap="round">
    <path d="M36 27 L36 39"/>
    <path d="M92 27 L92 39"/>
    <path d="M36 79 L36 91"/>
    <path d="M92 79 L92 91"/>
  </g>

  <!-- MD monogram -->
  <text
    x="64"
    y="76"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="43"
    font-weight="900"
    letter-spacing="-5"
    fill="url(#letterGradient)"
  >MD</text>
</svg>
